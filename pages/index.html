<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graphabet</title>
    <meta name="description" content="A love letter to rewriting, graph grammars and wave function collapse, told with an alphabet of rotated rectangles." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/node_modules/@ape-egg/vibe/vibe.css" />
    <link rel="stylesheet" href="/node_modules/@ape-egg/codie/codie.css" />
    <link rel="stylesheet" href="/css/site.css" />

    <script type="module">
      import vibe from "/node_modules/@ape-egg/vibe/index.js";
      import code from "/js/code.js";
      import favicon from "/js/favicon.js";
      import { colors } from "/js/draw.js";

      window.$ = vibe({ white: true });
      Object.entries(colors).forEach(([k, c]) => document.documentElement.style.setProperty(`--piece-${k}`, c));
      favicon();
      $.on("ready", code);
    </script>
  </head>

  <body stylecheat dark vibe-fouc>
    <carousel white="@[white]">
      <slides y scrollbar>
        <slide><component src="/components/Grid.html"></component></slide>
        <slide><component src="/components/Message.html"></component></slide>
        <slide><component src="/components/Alphabet.html"></component></slide>
        <slide><component src="/components/Generator.html"></component></slide>
      </slides>
    </carousel>
    <color-toggle>
      <input type="checkbox" role="switch" aria-label="Colors" checked="@[!white]" onchange="$.white = !this.checked" />
    </color-toggle>
  </body>
</html>
