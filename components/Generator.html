<script type="module">
  import component from '@ape-egg/vibe/component';
  import { art, draw, ghost } from '/js/draw.js';
  import { capital, generate } from '/js/generator.js';

  const count = (shapes, k) => shapes.filter(p => p.k === k).length;
  const view = (seed, seams, pick) => {
    const { glyphs, tally } = generate(seed);
    const g = glyphs[pick];
    return {
      seed, seams, pick, ...tally,
      fresh: glyphs.filter(x => !x.match).length,
      glyphs: glyphs.map(x => ({ art: art('-1.1 -0.5 6.2 7', draw(x, { seams })), old: !!x.match })),
      big: art('-0.5 -0.5 6 7', ghost + draw(g, { seams })),
      old: !!g.match,
      steps: [
        'Glyph',
        Object.keys(g.c).map(capital).join(' '),
        Object.entries(g.c).map(([s, v]) => `${capital(s)} → ${v}`).join(' · '),
        g.fired.join(' · ') || 'No joint rule fired',
        `Upright ×${count(g.pieces, 'upright')} · Flat ×${count(g.pieces, 'flat')} · Corner ×${count(g.pieces, 'corner')} · Diagonal ×${count(g.pieces, 'diagonal')} · Circle ×${g.circles.length}`,
        `${g.pieces.length} rectangles · ${g.pieces.length * 2} triangles · ${g.circles.length} circles, ${g.circles.filter(c => c.loose).length} on loose ends`
      ]
    };
  };

  component({
    ...view(1, false, 0),
    toggleSeams() { Object.assign(this, view(this.seed, !this.seams, this.pick)); },
    next() { Object.assign(this, view(this.seed + 1, this.seams, 0)); },
    prev() { Object.assign(this, view(Math.max(1, this.seed - 1), this.seams, 0)); }
  });
</script>

<slide-wide>
  <crow justify-between w-full wrap g-2>
    <h2>New letters</h2>
    <crow g-2 wrap left>
      <button secondary sm onclick="this.toggleSeams()">@[this.seams ? 'Hide triangles' : 'Show triangles']</button>
      <button secondary sm onclick="this.prev()">Previous seed</button>
      <button primary sm onclick="this.next()">Next seed</button>
    </crow>
  </crow>

  <crow g-3 w-full stretch sm:vertical>
    <codie dark></codie>
    <card left g-2>
      <crow justify-between w-full>
        <h6>Glyph @[this.pick + 1]</h6>
        <!-- if this.old -->
        <badge secondary>An old friend</badge>
        <!-- else -->
        <badge bg-green text-green>New</badge>
        <!-- /if -->
      </crow>
      <glyph-art big role="img" aria-label="The chosen glyph over every location A–Z uses">@[$.unsafe(this.big)]</glyph-art>
      <ol>
        <!-- each this.steps as step -->
        <li><step>@[step]</step></li>
        <!-- /each -->
      </ol>
    </card>
  </crow>

  <crow g-2 w-full stretch wrap>
    <!-- each this.glyphs as glyph, i -->
    <card glyph f-1 vertical g-2 p-2 picked="@[this.pick === i]">
      <glyph-art role="img" aria-label="Glyph @[i + 1]">@[$.unsafe(glyph.art)]</glyph-art>
      <!-- if glyph.old -->
      <badge bg-hollow>An old friend</badge>
      <!-- else -->
      <badge bg-green text-green>New</badge>
      <!-- /if -->
    </card>
    <!-- /each -->
  </crow>

  <crow left g-2 wrap>
    <!-- if false -->
    <badge bg-green text-green>@[this.fresh] of 8 new · seed @[this.seed]</badge>
    <badge bg-red text-red>@[this.off] off the alphabet</badge>
    <badge secondary>@[this.apart] fell apart</badge>
    <badge bg-orange text-orange>@[this.overlap] overlapped</badge>
    <!-- /if -->
  </crow>
</slide-wide>
