<script type="module">
  import component from '@ape-egg/vibe/component';
  import { alphabet, colors, glyphs, overlapping } from '/js/draw.js';
  import { capital } from '/js/generator.js';

  const rects = glyphs.flatMap(g => g.pieces).length;

  component({
    totals: `${rects} rectangles · ${rects * 2} triangles · ${glyphs.flatMap(g => g.circles).length} circles`,
    check: overlapping.length ? `Overlap in ${overlapping.join(', ')}` : 'A-Z | Latin alphabet',
    image: alphabet,
    legend: Object.entries(colors).map(([k, color]) => ({ name: capital(k), color }))
  });
</script>

<slide-wide>
  <crow justify-between w-full wrap g-2>
    <h2>The alphabet</h2>
    <crow g-2 wrap left>
      <badge secondary>@[this.totals]</badge>
      <badge bg-green text-green>@[this.check]</badge>
    </crow>
  </crow>
  <alphabet-sheet role="img" aria-label="A to Z built from rotated rectangles joined by circles">@[$.unsafe(white ? this.image.white : this.image.colored)]</alphabet-sheet>
  <crow g-4 wrap left w-full>
    <!-- each this.legend as item -->
    <legend-item style="color: @[white ? '#fff' : item.color]">@[item.name]</legend-item>
    <!-- /each -->
  </crow>
</slide-wide>
