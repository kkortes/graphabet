<script type="module">
  import component from '@ape-egg/vibe/component';
  import { defs, frame, image, lattice, place, reach } from '/js/lattice.js';

  // A letter unit is 10px, so a tile is 40 × 60 and a piece a little over a pixel thick. The signal runs 18ms
  // per unit of path and dies out 60 units along it
  const [unit, step, far] = [10, 18, 60];
  let net, count = 0;
  const tiles = () => (net = lattice(Math.ceil(innerWidth / unit / 4), Math.ceil(innerHeight / unit / 6)), image(net, unit));
  const id = component({ tiles: tiles(), signals: [] });

  // One signal at a time, keyed by click like the intro grid's flashes: every element waits for the moment the
  // signal reaches it along the paths, lights up and fades, so the fade follows the wave out from the click
  const timing = d => `--t: ${Math.round(d * step)}ms; --a: ${(1 - d / far).toFixed(2)}`;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const signal = e => {
    if (motion.matches || !e.detail) return;
    const dist = reach(net, [e.clientX / unit, e.clientY / unit], far), lit = new Map();
    const sparks = net.links.filter(l => dist.has(l.a) && dist.has(l.b)).map(l => {
      const d = Math.min(dist.get(l.a), dist.get(l.b)), [[x1, y1], [x2, y2]] = l.ends;
      l.cells.forEach(k => lit.set(k, Math.min(lit.get(k) ?? far, d)));
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="${timing(d)}"/>`;
    });
    const cells = [...lit].map(([k, d]) => [net.cells[k], d]);
    $[id].signals = [{ n: count++, svg: frame(net, unit, defs(cells.map(([c]) => c)) + cells.map(([c, d]) => place(c, timing(d))).join('') + sparks.join('')) }];
  };
  const resize = () => (innerWidth > net.cols * unit * 4 || innerHeight > net.rows * unit * 6) && ($[id].tiles = tiles());
  document.addEventListener('click', signal);
  addEventListener('resize', resize);
  $.on('unmount', () => (document.removeEventListener('click', signal), removeEventListener('resize', resize)));
</script>

<lattice aria-hidden="true">
  <lattice-tiles><img src="@[this.tiles]" alt="" /></lattice-tiles>
  <!-- each this.signals as signal (signal.n) -->
  <lattice-signal>@[$.unsafe(signal.svg)]</lattice-signal>
  <!-- /each -->
</lattice>
